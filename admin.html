<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shizuku Lab Website Admin</title>
<style>
:root{--ink:#172019;--forest:#123f2f;--paper:#f4f0e7;--line:#d9d4ca;--white:#fff}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,sans-serif;color:var(--ink);background:#ece8df}
button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(360px,520px) 1fr}
.sidebar{background:#153c2e;color:white;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar h1{font:25px Georgia;margin:0 0 8px}.sidebar p{color:#b9c9be;font-size:12px;margin:0 0 25px}.nav button{display:block;width:100%;border:0;background:transparent;color:#dce8df;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#2c5746;color:#fff}
.editor{padding:28px;background:#f7f3eb;height:100vh;overflow:auto;border-right:1px solid var(--line)}.panel{display:none}.panel.active{display:block}.panel h2{font:34px Georgia;margin:0 0 8px}.panel>p{color:#667168;margin:0 0 24px}
.group{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.group h3{margin:0 0 14px}.field{display:block;margin:12px 0}.field span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#647068;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid #cfcabf;border-radius:8px;background:#fff}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{position:sticky;bottom:-28px;background:#f7f3eb;padding:14px 0 0;display:flex;gap:8px;z-index:5}.actions button{border:1px solid var(--forest);padding:10px 14px;border-radius:999px;background:white;cursor:pointer}.actions .primary{background:var(--forest);color:white}
.preview{background:#d8d6cf;padding:18px;height:100vh;position:sticky;top:0}.previewbar{height:44px;display:flex;justify-content:space-between;align-items:center}.devices button{border:0;background:transparent;padding:7px 10px;cursor:pointer}.devices button.active{background:white;border-radius:8px}.framewrap{height:calc(100vh - 70px);display:flex;justify-content:center}.framewrap iframe{width:100%;height:100%;border:0;background:white;border-radius:12px;box-shadow:0 15px 50px #0002;transition:width .25s}.framewrap.mobile iframe{width:390px}.framewrap.tablet iframe{width:820px}
.item{border-top:1px solid #e5e0d7;padding-top:14px;margin-top:14px}.notice{font-size:12px;background:#e7eddc;padding:12px;border-radius:9px;color:#37533d}
@media(max-width:1050px){.app{grid-template-columns:190px 1fr}.preview{display:none}}@media(max-width:650px){.app{display:block}.sidebar{position:relative;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.editor{height:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><h1>Shizuku Lab</h1><p>Website Admin · v1</p><div class="nav" id="nav"></div></aside>
<main class="editor">
<div class="notice">Changes preview immediately. Click <b>Export site-data.js</b>, then upload that one file to GitHub to publish.</div>
<div id="panels"></div>
<div class="actions"><button id="reset">Reset preview</button><button id="save" class="primary">Save preview</button><button id="export">Export site-data.js</button></div>
</main>
<section class="preview"><div class="previewbar"><b>Live Preview</b><div class="devices"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div></div><div class="framewrap" id="framewrap"><iframe id="previewFrame" src="index.html"></iframe></div></section>
</div>
<script src="site-data.js"></script>
<script>
const cloneData=value=>JSON.parse(JSON.stringify(value));
if(!window.SHIZUKU_DATA){
 document.getElementById('panels').innerHTML='<div class="group" style="margin-top:16px;color:#8b2525"><h3>Website data could not be loaded</h3><p>Please make sure <b>site-data.js</b> is beside <b>admin.html</b>, then refresh this page.</p></div>';
 throw new Error('site-data.js did not create window.SHIZUKU_DATA');
}
const original=cloneData(window.SHIZUKU_DATA);let data=cloneData(original);
const sections=[
 ['Brand & Logo','brand'],['Hero','hero'],['Our Story','story'],['Our Matcha','matcha'],['Matcha Library','library'],['Japan Atlas','atlas'],['Menu','menu'],['Small Updates','updates'],['Contact','contact'],['Closing','closing']
];
const nav=document.getElementById('nav'),panels=document.getElementById('panels'),frame=document.getElementById('previewFrame');
const input=(label,path,value,type='text',options='')=>`<label class="field"><span>${label}</span>${type==='textarea'?`<textarea data-path="${path}">${value??''}</textarea>`:type==='select'?`<select data-path="${path}">${options}</select>`:`<input type="${type}" data-path="${path}" value="${String(value??'').replaceAll('"','&quot;')}"></label>`};
function itemFields(list,key,fields){return list.map((it,i)=>`<div class="item"><h3>${key} ${i+1}</h3>${fields.map(f=>input(f[0],`${key}.${i}.${f[1]}`,it[f[1]],f[2]||'text')).join('')}</div>`).join('')}
function makePanels(){
 nav.innerHTML=sections.map((s,i)=>`<button data-panel="${s[1]}" class="${i?'':'active'}">${s[0]}</button>`).join('');
 panels.innerHTML=`
 <section class="panel active" data-panel="brand"><h2>Brand & Logo</h2><p>Adjust logo sizes and core colours.</p><div class="group">${input('Logo file','brand.logo',data.brand.logo)}<div class="row">${input('Desktop logo size','brand.logoDesktop',data.brand.logoDesktop,'number')}${input('Mobile logo size','brand.logoMobile',data.brand.logoMobile,'number')}</div><div class="row">${input('Main green','brand.mainColor',data.brand.mainColor,'color')}${input('Paper colour','brand.paperColor',data.brand.paperColor,'color')}</div>${input('Rice colour','brand.riceColor',data.brand.riceColor,'color')}</div></section>
 <section class="panel" data-panel="hero"><h2>Hero</h2><p>Edit title, image, size and arrangement.</p><div class="group">${input('Eyebrow','hero.eyebrow',data.hero.eyebrow)}${input('Main title','hero.title',data.hero.title)}${input('Italic line','hero.titleItalic',data.hero.titleItalic)}${input('Body','hero.body',data.hero.body,'textarea')}${input('Image file','hero.image',data.hero.image)}<div class="row">${input('Desktop title size','hero.fontSizeDesktop',data.hero.fontSizeDesktop,'number')}${input('Mobile title size','hero.fontSizeMobile',data.hero.fontSizeMobile,'number')}</div>${input('Alignment','hero.align',data.hero.align,'select','<option>left</option><option>center</option><option>right</option>')}</div></section>
 <section class="panel" data-panel="story"><h2>Our Story</h2><div class="group">${input('Title','story.title',data.story.title,'textarea')}${input('Paragraph 1','story.paragraph1',data.story.paragraph1,'textarea')}${input('Paragraph 2','story.paragraph2',data.story.paragraph2,'textarea')}${input('Image file','story.image',data.story.image)}</div></section>
 <section class="panel" data-panel="matcha"><h2>Our Matcha</h2><p>The photo is now set to show the full cup rather than crop it.</p><div class="group">${input('Title','matcha.title',data.matcha.title,'textarea')}${input('Description','matcha.body',data.matcha.body,'textarea')}${input('Image file','matcha.image',data.matcha.image)}${input('Image fit','matcha.imageFit',data.matcha.imageFit,'select','<option>contain</option><option>cover</option>')}<div class="row">${input('Origin','matcha.origin',data.matcha.origin)}${input('Harvest','matcha.harvest',data.matcha.harvest)}</div>${input('Cultivar','matcha.cultivar',data.matcha.cultivar)}${input('Tasting notes','matcha.tastingNotes',data.matcha.tastingNotes)}${input('Finish','matcha.finish',data.matcha.finish)}</div></section>
 <section class="panel" data-panel="library"><h2>Matcha Library</h2><p>Edit intro and all cultivar cards. Add/delete is available by editing the list below in this first version.</p><div class="group">${input('Intro title','library.introTitle',data.library.introTitle,'textarea')}${input('Intro body','library.introBody',data.library.introBody,'textarea')}</div><div class="group">${itemFields(data.library.cultivars,'library.cultivars',[['Name','name'],['Region','region'],['Image','image'],['Profile','profile','textarea'],['Tag 1','tag1'],['Tag 2','tag2']])}</div></section>
 <section class="panel" data-panel="atlas"><h2>Japan Atlas</h2><p>Edit region names, content and cultivar lists.</p><div class="group">${itemFields(data.atlas.regions,'atlas.regions',[['ID','id'],['Region name','name'],['Description','copy','textarea'],['Cultivars (comma separated)','cultivars'],['Style notes (comma separated)','notes']])}</div></section>
 <section class="panel" data-panel="menu"><h2>Menu</h2><p>Edit four featured drinks.</p><div class="group">${itemFields(data.menu,'menu',[['Eyebrow','eyebrow'],['Name','name'],['Description','description','textarea'],['Price','price'],['Image','image']])}</div></section>
 <section class="panel" data-panel="updates"><h2>Small Updates</h2><p>Fixed at three updates.</p><div class="group">${itemFields(data.updates,'updates',[['Date / label','date'],['Title','title'],['Content','body','textarea'],['Image','image']])}</div></section>
 <section class="panel" data-panel="contact"><h2>Contact</h2><div class="group">${input('Title','contact.title',data.contact.title,'textarea')}${input('Collection info','contact.collection',data.contact.collection,'textarea')}${input('Instagram','contact.instagram',data.contact.instagram)}${input('Instagram URL','contact.instagramUrl',data.contact.instagramUrl)}${input('Order URL','contact.orderUrl',data.contact.orderUrl)}</div></section>
 <section class="panel" data-panel="closing"><h2>Closing Section</h2><div class="group">${input('Logo file','closing.logo',data.closing.logo)}${input('Logo size','closing.logoSize',data.closing.logoSize,'number')}${input('Thank-you message','closing.message',data.closing.message,'textarea')}${input('Button text','closing.button',data.closing.button)}</div></section>`;
 document.querySelectorAll('select[data-path]').forEach(el=>el.value=get(el.dataset.path));
}
function get(path){return path.split('.').reduce((o,k)=>o?.[k],data)}
function set(path,value){const keys=path.split('.');let o=data;keys.slice(0,-1).forEach(k=>o=o[k]);const last=keys.at(-1);const old=o[last];if(Array.isArray(old))o[last]=String(value).split(',').map(x=>x.trim()).filter(Boolean);else if(typeof old==='number')o[last]=Number(value);else o[last]=value}
function preview(){frame.contentWindow.postMessage({type:'SHIZUKU_PREVIEW',data},'*')}
makePanels();
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.nav button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector(`.panel[data-panel="${b.dataset.panel}"]`)?.classList.add('active')});
panels.addEventListener('input',e=>{if(!e.target.dataset.path)return;set(e.target.dataset.path,e.target.value);preview()});
document.getElementById('save').onclick=()=>{localStorage.setItem('shizuku-admin-preview',JSON.stringify(data));preview();alert('Preview saved on this device.')};
document.getElementById('reset').onclick=()=>{data=cloneData(original);localStorage.removeItem('shizuku-admin-preview');frame.contentWindow.postMessage({type:'SHIZUKU_CLEAR_PREVIEW'},'*');makePanels()};
document.getElementById('export').onclick=()=>{const blob=new Blob(['window.SHIZUKU_DATA = '+JSON.stringify(data,null,2)+';\\n'],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='site-data.js';a.click();URL.revokeObjectURL(a.href)};
document.querySelector('.devices').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.devices button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('framewrap').className='framewrap '+(b.dataset.device==='desktop'?'':b.dataset.device)};
</script>
</body></html>
