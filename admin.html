<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shizuku Lab Admin v4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Gloock&family=Noto+Serif+JP:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#172019;--forest:#173e31;--paper:#f7f3eb;--line:#d9d4ca}*{box-sizing:border-box}body{margin:0;font:14px/1.5 'DM Sans',sans-serif;color:var(--ink);background:#e9e5dc}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:225px minmax(390px,540px) 1fr}.sidebar{background:var(--forest);color:white;padding:24px 16px;height:100vh;overflow:auto;position:sticky;top:0}.sidebar h1{font:30px 'Gloock';margin:0}.sidebar p{font-size:11px;opacity:.7}.nav button{display:block;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:#d9e5dd;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18}.editor{height:100vh;overflow:auto;padding:26px;background:var(--paper);border-right:1px solid var(--line)}.notice{background:#e3eadb;border-radius:9px;padding:12px;margin-bottom:18px;font-size:12px}.panel{display:none}.panel.active{display:block}.panel h2{font:38px 'Gloock';margin:0}.panel>p{color:#687269}.group{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}.item{border-top:1px solid #e6e0d6;margin-top:18px;padding-top:18px}.item:first-child{border:0;margin-top:0}.item-head{display:flex;justify-content:space-between;align-items:center}.field{display:block;margin:11px 0}.field>span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#667268;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbc6bc;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:85px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.image-preview{width:100%;height:150px;object-fit:contain;background:#eee;border-radius:8px;margin-top:8px}.image-crop{height:190px;overflow:hidden;background:#eee;border-radius:10px;margin-top:8px;cursor:grab;touch-action:none;position:relative}.image-crop.is-dragging{cursor:grabbing}.image-crop:after{content:'↔  drag  ↕';position:absolute;right:8px;bottom:8px;background:#fff9;border-radius:999px;padding:4px 8px;font-size:10px;pointer-events:none}.image-crop img{width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}.image-tools{display:flex;gap:9px;align-items:center;margin-top:8px}.image-tools small{margin-right:auto;color:#667268}.image-tools label{display:flex;align-items:center;gap:5px;font-size:11px}.image-tools input{width:105px!important;padding:0!important}.image-tools button{border:1px solid #a9aaa4;background:#fff;border-radius:999px;padding:5px 8px}.position-control>span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#667268;margin-bottom:5px}.position-pad{height:120px;border:1px solid #cbc6bc;border-radius:10px;background:linear-gradient(#0000 49.5%,#173e3133 50%,#0000 50.5%),linear-gradient(90deg,#0000 49.5%,#173e3133 50%,#0000 50.5%),#f7f7f4;position:relative;cursor:crosshair;touch-action:none}.position-pad b{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--forest);border:3px solid white;box-shadow:0 1px 8px #0004;transform:translate(-50%,-50%)}.position-control small{display:block;margin-top:6px;color:#667268}.drag-handle{width:36px;height:32px;border-radius:8px!important;display:grid!important;grid-template-columns:repeat(2,4px);grid-template-rows:repeat(3,4px);place-content:center;gap:3px;padding:0!important;cursor:grab!important}.drag-handle:active{cursor:grabbing!important}.drag-handle i{display:block;width:4px;height:4px;border-radius:50%;background:currentColor}.reorder-item.dragging{opacity:.35}.reorder-item.drag-over{outline:2px solid var(--forest);outline-offset:5px}.small-actions{display:flex;gap:6px;flex-wrap:wrap}.small-actions button,.add-btn{border:1px solid var(--forest);background:white;color:var(--forest);border-radius:999px;padding:7px 10px;cursor:pointer}.delete{border-color:#a54d49!important;color:#a54d49!important}.actions{position:sticky;bottom:-26px;background:var(--paper);padding:14px 0;display:flex;gap:8px}.actions button{border:1px solid var(--forest);border-radius:999px;padding:10px 14px;background:white}.actions .primary{background:var(--forest);color:white}.preview{height:100vh;padding:16px;background:#d2d0c9;position:sticky;top:0}.previewbar{height:45px;display:flex;justify-content:space-between;align-items:center}.preview iframe{height:calc(100vh - 70px);width:100%;border:0;border-radius:12px;background:white;box-shadow:0 15px 45px #0002;transition:.2s}.preview.mobile iframe{width:390px;display:block;margin:auto}.devices button{border:0;background:none;padding:7px}.devices button.active{background:white;border-radius:7px}@media(max-width:1100px){.app{grid-template-columns:200px 1fr}.preview{display:none}}@media(max-width:670px){.app{display:block}.sidebar{position:relative;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.editor{height:auto}}
</style></head><body><div class="app"><aside class="sidebar"><h1>Shizuku Lab</h1><p>Website CMS · v4</p><div id="nav" class="nav"></div></aside><main class="editor"><div class="notice">Everything updates immediately in the preview. Upload images here, then export <b>site-data.js</b> when ready.</div><div id="panels"></div><div class="actions"><button id="reset">Reset</button><button id="save" class="primary">Save preview</button><button id="export">Export site-data.js</button></div></main><section class="preview" id="preview"><div class="previewbar"><b>Live preview</b><div class="devices"><button class="active" data-device="desktop">Desktop</button><button data-device="mobile">Mobile</button></div></div><iframe id="frame" src="index.html?admin=1"></iframe></section></div><script src="site-data.js"></script><script src="admin.js"></script></body></html>
